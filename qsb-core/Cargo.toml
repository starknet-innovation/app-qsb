[package]
name = "qsb-core"
version = "0.1.0"
edition = "2021"
description = "Device-independent logic of the QSB Ledger app: streaming transaction parsing, QSB vault script matching, BIP-143 and BIP-322 sighashes, address encoding, the signing session state machine, and HORS secret derivation with its one-time reveal guard."
license = "Apache-2.0"
publish = false

[dependencies]

[dev-dependencies]
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
bitcoin = "0.32"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"

