name: Ensure compliance with Ledger guidelines

# Exactly what the reusable workflow declares (a caller granting less makes the
# run fail): read the code, run its sub-workflows, pull the app-builder image.
permissions:
  contents: read
  actions: write
  pull-requests: write
  packages: read

# Mandatory for every app listed in Ledger's app store.

# Ledger's reusable workflows (LedgerHQ/ledger-app-workflows) are what Ledger
# runs for app submissions. The starknet-innovation Actions policy doesn't allow
# workflows from outside the organization yet, so this one only runs by hand;
# ci.yml does the same work on every push. Once an org admin allowlists
# LedgerHQ/ledger-app-workflows/*, restore the push and pull_request triggers.

on:
  workflow_dispatch:

jobs:
  guidelines_enforcer:
    name: Call Ledger guidelines_enforcer
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_guidelines_enforcer.yml@0e5967c623a6cd5931c931f5135edb134eba9257 # v1
