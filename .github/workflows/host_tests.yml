name: Host tests

# The device-independent core (pqb-core), the TypeScript client and the pqb adapter, on the host.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  pqb_core:
    name: pqb-core unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pqb-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -Dwarnings
      - run: cargo test

  js_client:
    name: TypeScript client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python_adapter:
    name: pqb adapter (clients/python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installs pqb from GitHub at the commit pyproject.toml pins.
      - run: pip install -e '.[dev]'
      - run: flake8 src tests
      - working-directory: clients/python/tests
        run: python -W ignore::ResourceWarning -m unittest -v test_device
