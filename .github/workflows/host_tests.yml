name: Host tests

# The device-independent core (qsb-core) and the TypeScript client, on the host.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  qsb_core:
    name: qsb-core unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qsb-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -Dwarnings
      - run: cargo test

  js_client:
    name: TypeScript client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
