name: Host tests

# The device-independent core (pqb-core), the TypeScript client and the pqb adapter, on the host.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  pqb_core:
    name: pqb-core unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pqb-core
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit (the `stable` branch on 2026-11-17); the toolchain is the input.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -Dwarnings
      - run: cargo test

  js_client:
    name: TypeScript client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python_adapter:
    name: pqb adapter (clients/python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    env:
      # fireblocks-labs/pqb is private: a read-only token for it (fine-grained, Contents: read on
      # that one repository), stored as this repository's PQB_REPO_TOKEN secret. Without it the
      # job is skipped, not failed.
      PQB_REPO_TOKEN: ${{ secrets.PQB_REPO_TOKEN }}
    steps:
      - name: Skip without access to pqb
        if: env.PQB_REPO_TOKEN == ''
        working-directory: .
        run: echo "::notice::PQB_REPO_TOKEN is not set; skipping the pqb adapter tests (fireblocks-labs/pqb is private)."
      - uses: actions/checkout@v4
        if: env.PQB_REPO_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.PQB_REPO_TOKEN != ''
        with:
          python-version: "3.11"
      # Installs pqb from GitHub at the commit pyproject.toml pins, through the token.
      - name: Install
        if: env.PQB_REPO_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${PQB_REPO_TOKEN}@github.com/fireblocks-labs/pqb".insteadOf "https://github.com/fireblocks-labs/pqb"
          pip install -e '.[dev]'
      - name: Lint
        if: env.PQB_REPO_TOKEN != ''
        run: flake8 src tests
      - name: Tests
        if: env.PQB_REPO_TOKEN != ''
        working-directory: clients/python/tests
        run: python -W ignore::ResourceWarning -m unittest -v test_device
