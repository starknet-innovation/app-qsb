[package]
name = "app-qsb"
version = "0.1.0"
authors = ["Starknet Foundation"]
edition = "2021"
license = "Apache-2.0"
description = "Ledger app for QSB (quantum-safe Bitcoin) vaults: clear-signs deposits, withdrawals and sign-ins, and derives the vaults' HORS secrets, revealing them once per vault."

[dependencies]
ledger_device_sdk = { version = "1.42", features = ["io_new", "sys"] }
qsb-core = { path = "../qsb-core" }

[build-dependencies]
# Turn the Nano icon and its mask into the home-screen glyph (see build.rs).
gif = "0.14"
png = "0.18"

[features]
default = ["ledger_device_sdk/nano_nbgl"]
debug = ["ledger_device_sdk/debug"]

[package.metadata.ledger]
curve = ["secp256k1"]
flags = "0"
# BIP-84 (P2WPKH) and BIP-49 (P2SH-P2WPKH) Bitcoin mainnet accounts only.
path = ["84'/0'", "49'/0'"]
# The SLIP-0021 key the HORS secrets are derived from. After changing this,
# `cargo clean -p ledger_device_sdk`: its build script doesn't rerun on its own.
path_slip21 = ["QSB-HORS"]
name = "QSB"
nanosplus = { icon = "icons/qsb_14x14.gif" }
nanox = { icon = "icons/qsb_14x14.gif" }
stax = { icon = "icons/qsb_32x32.gif" }
flex = { icon = "icons/qsb_40x40.gif" }
apex_p = { icon = "icons/qsb_32x32.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanox", "nanosplus"))'] }
