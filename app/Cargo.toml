[package]
name = "app-pqb"
version = "0.2.0"
authors = ["Starknet Foundation"]
edition = "2021"
license = "Apache-2.0"
description = "Ledger app for PQB (Post-Quantum Bitcoin) vaults: derives each vault's one-time secrets from the seed (BIP 85, profile PQB-v1), signs its funding sweep, and discloses a withdrawal's secrets and co-signature once per vault."

[dependencies]
ledger_device_sdk = { version = "1.42", features = ["io_new", "sys"] }
pqb-core = { path = "../pqb-core" }

[build-dependencies]
# Turn the Nano icon and its mask into the home-screen glyph (see build.rs).
gif = "0.14"
png = "0.18"

[features]
default = ["ledger_device_sdk/nano_nbgl"]
debug = ["ledger_device_sdk/debug"]

[package.metadata.ledger]
curve = ["secp256k1"]
flags = "0"
# BIP 85, BIP 39 application, English, 24 words: every vault seed derives from
# m/83696968'/39'/0'/24'/v'. Nothing else: no account key, no SLIP-21 label.
path = ["83696968'/39'/0'/24'"]
name = "PQB"
nanosplus = { icon = "icons/pqb_14x14.gif" }
nanox = { icon = "icons/pqb_14x14.gif" }
stax = { icon = "icons/pqb_32x32.gif" }
flex = { icon = "icons/pqb_40x40.gif" }
apex_p = { icon = "icons/pqb_32x32.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanox", "nanosplus"))'] }
